        #     description: "High 5xx error for {{ $labels.deployment }}  in last 1 minutes. Current Value is {{ $value }}"

        # - alert: Service_429_ErrorThresholdExceeded
        #   expr: kube_deployment_labels * on (deployment,namespace) group_right(label_team)((sum(irate(response_total{namespace="microservices", direction="inbound", status_code="429"}[1m])) by (deployment,namespace)/sum(irate(response_total{namespace="microservices",direction="inbound"}[1m])) by (deployment,namespace) *100) > 10 )
        #   for: 1m
        #   labels:
        #     severity: critical
        #     namespace: "{{ $labels.namespace }}"
        #     team: "{{ $labels.label_team }}"

        #   annotations:
        #     message: "{{ $labels.deployment }}  429 error thresholdexceeded"
        #     description: "High 429 error for {{ $labels.deployment }}  in last 1 minutes. Current Value is {{ $value }}"

        - alert: URGENT PW Skills NGINX DOWN.
          expr: nginx_up == 1
          for: 1m
          labels:
            severity: critical
            team: "pw-skills"

          annotations:
            message: "[URGENT]PW Skills Service Down."
            description: "PW Skills Service Nginx Server Down."